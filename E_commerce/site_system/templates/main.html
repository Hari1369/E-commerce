<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maya Fashion Arts</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #333;
            color: #fff;

            display: flex;
            align-items: center;

            padding-left: 20px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.2);

            z-index: 1000;
        }
        .toggle-btn {
            font-size: 28px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;

            margin-right: 20px;
        }
        .top-header h1 {
            font-size: 20px;
            margin: 0;
        }
        .sidebar {
            position: fixed;

            top: 60px;
            left: -250px;

            width: 250px;
            height: calc(100% - 60px);

            background-color: #222;

            transition: 0.3s;

            z-index: 999;
        }
        .sidebar.active {
            left: 0;
        }
        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid #444;
        }
        .sidebar a:hover {
            background-color: #444;
        }
        .content {
            padding: 80px 20px 20px;
        }
    </style>
</head>

<body>
    <header class="top-header">
        <button class="toggle-btn" onclick="toggleSidebar()">
            ☰
        </button>
        <h1>Maya Fashion Arts</h1>

    </header>


    <div class="sidebar" id="sidebar">
        <a href="{% url 'main_page' %}">
            Home
        </a>
        <a href="{% url 'brand_registration' %}">
            Brand Registration
        </a>
        <a href="{% url 'product_page' %}">
            Product Registration
        </a>
        <a href="{% url 'subproduct_page' %}">
            Sub Product
        </a>

    </div>


    <div class="content">
        <h2>Welcome to Maya Fashion Arts</h2>
    </div>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("active");
        }
    </script>
</body>
</html>
